<body>
    <form action="/action">
        <label>username<input placeholder="Name" type="text"></label>

        <div>
            <label for="username">Username : </label>

        <div>
            <label for="age">Age : </label>
            <input id="age" placeholder=" Enter your email" type="email" name="age">
        </div>
        <button>Submit</button>
        <button type="reset">Reset</button>

    </form>
